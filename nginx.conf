server {
  listen 80;
  server_name _;

  # Increase if uploads via frontend are proxied here (usually not needed).
  client_max_body_size 100m;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    # In local dev builds, avoid caching static artifacts without hashes.
    add_header Cache-Control no-cache;
  }
}